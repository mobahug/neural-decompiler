[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neural-decompiler"
version = "0.1.0"
description = "Causal circuit discovery and mechanistic interpretability experiments"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { file = "LICENSE" }
dependencies = [
    "matplotlib>=3.8,<4",
    "torch>=2.6,<3",
    "transformer-lens~=3.9.0",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
